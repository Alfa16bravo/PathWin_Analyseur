name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PathAnalyzer/PathAnalyzer.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Version: $version"

      - name: Restore
        run: dotnet restore PathAnalyzer/PathAnalyzer.csproj

      - name: Build
        run: dotnet build PathAnalyzer/PathAnalyzer.csproj -c Release --no-restore

      - name: Publish (single self-contained executable)
        run: >
          dotnet publish PathAnalyzer/PathAnalyzer.csproj -c Release -r win-x64
          -p:SelfContained=true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/standalone

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" installer\PathWinAnalyzer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Collect the files to ship
        shell: pwsh
        run: |
          Copy-Item publish/standalone/PathWinAnalyzer.exe out/PathWinAnalyzer-portable.exe
          Get-ChildItem out -Filter *.exe | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: PathWinAnalyzer
          path: out/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" out/PathWinAnalyzer-Setup.exe out/PathWinAnalyzer-portable.exe --title "PathWin Analyzer $env:VERSION" --generate-notes
